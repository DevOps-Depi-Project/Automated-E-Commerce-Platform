# Images are named <DOCKERHUB_USER>/ecommerce-<service>:<IMAGE_TAG> (set both in .env).
# Build with "docker compose build" and publish with "docker compose push".

# Shared healthcheck settings for the Node.js services.
# BusyBox wget (built into Alpine) is far lighter than starting a node process per check.
x-node-healthcheck: &node-healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # The first start initialises the database; on a busy machine (e.g. the CI host) that
      # can take minutes. Failures during start_period do not count against retries.
      start_period: 120s

  authentication-service:
    build:
      context: ./authentication-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-local}/ecommerce-authentication-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # A bad ADMIN_* value is logged but does not stop the service from starting.
    command: sh -c 'npm run migrate && { if [ -n "$$ADMIN_EMAIL" ] && [ -n "$$ADMIN_PASSWORD" ]; then npm run seed:admin || echo "WARNING - admin seed failed, continuing without it"; fi; } && exec node server.js'
    # Internal only: the browser reaches this service through Nginx at /api/...
    expose:
      - "3003"
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecommerce}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Demo Admin}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3003/health"]

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-local}/ecommerce-product-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: sh -c "npm run migrate && exec node server.js"
    # Internal only: the browser reaches this service through Nginx at /api/...
    expose:
      - "3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecommerce}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/health"]

  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-local}/ecommerce-cart-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: sh -c "npm run migrate && exec node server.js"
    # Internal only: the browser reaches this service through Nginx at /api/...
    expose:
      - "3006"
    environment:
      PORT: 3006
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecommerce}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://product-service:3001}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-5000}
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3006/health"]

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-local}/ecommerce-inventory-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: sh -c "npm run migrate && exec node server.js"
    # Internal only: the browser reaches this service through Nginx at /api/...
    expose:
      - "3004"
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecommerce}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-900}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3004/health"]

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-local}/ecommerce-order-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: sh -c "npm run migrate && exec node server.js"
    # Internal only: the browser reaches this service through Nginx at /api/...
    expose:
      - "3002"
    environment:
      PORT: 3002
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecommerce}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://product-service:3001}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-5000}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://inventory-service:3004}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://payment-service:3005/internal/payments}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3002/health"]

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-local}/ecommerce-payment-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: sh -c "npm run migrate && exec node server.js"
    expose:
      - "3005"
    environment:
      PORT: 3005
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecommerce}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      # Note: simulation is always disabled while NODE_ENV=production (see payment-service/server.js).
      PAYMENT_SIMULATION_ENABLED: ${PAYMENT_SIMULATION_ENABLED:-false}
      PAYMENT_DEFAULT_RESULT: ${PAYMENT_DEFAULT_RESULT:-success}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3005/health"]

  search-service:
    build:
      context: ./search-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-local}/ecommerce-search-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: sh -c "npm run migrate && exec node server.js"
    expose:
      - "3007"
    environment:
      PORT: 3007
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecommerce}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://product-service:3001}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-5000}
      SEARCH_SYNC_INTERVAL_SECONDS: ${SEARCH_SYNC_INTERVAL_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3007/health"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-local}/ecommerce-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- monitoring (optional)
  # Started only with the "monitoring" profile:
  #   docker compose --profile monitoring up -d
  # Prometheus: http://localhost:9090   Grafana: http://localhost:3100 (dashboard "E-Commerce Overview")
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Anyone who can reach Grafana may view dashboards; editing needs the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/ecommerce-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || curl -fsS -o /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  ecommerce-network:
    driver: bridge
