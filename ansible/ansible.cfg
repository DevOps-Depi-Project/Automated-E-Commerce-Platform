[defaults]
# Generated by Terraform from the server's public IP.
inventory = inventory/hosts.ini
remote_user = ubuntu
private_key_file = ~/.ssh/depi-ecommerce
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml

[ssh_connection]
pipelining = True
# accept-new: trust a new server's host key the first time, refuse if it changes later.
# known_hosts lives in the mounted ~/.ssh so it survives between toolbox runs.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/keys/known_hosts_depi
