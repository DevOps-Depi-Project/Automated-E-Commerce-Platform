# Deploys the stack from Docker Hub images with Docker Compose.
#
# Files on the server (app_dir):
#   docker-compose.yml  copied from the repository
#   secrets.env         random passwords, generated once on the server, never leave it
#   release.env         image version and port (written for every deploy)
#   CURRENT_TAG / PREVIOUS_TAG / releases.log   deployment history used for rollback

- name: Refuse an empty image tag
  ansible.builtin.assert:
    that: image_tag | string | length > 0
    fail_msg: Pass the version to deploy, for example -e image_tag=80cb67d

- name: Create the application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Copy the Compose file from the repository
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "{{ app_dir }}/docker-compose.yml"
    mode: "0640"

- name: Generate secrets on the server (first deploy only)
  ansible.builtin.shell:
    cmd: |
      set -eu
      umask 077
      {
        echo "POSTGRES_USER=ecommerce"
        echo "POSTGRES_DB=ecommerce"
        echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
        echo "JWT_SECRET=$(openssl rand -hex 32)"
        echo "INTERNAL_SERVICE_TOKEN=$(openssl rand -hex 32)"
        echo "ADMIN_PASSWORD=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | cut -c1-20)"
      } > secrets.env
    chdir: "{{ app_dir }}"
    creates: "{{ app_dir }}/secrets.env"
  register: secrets_created
  no_log: true

- name: Read the version that is running now
  ansible.builtin.slurp:
    src: "{{ app_dir }}/CURRENT_TAG"
  register: current_tag_file
  failed_when: false

- name: Remember the running version for rollback
  ansible.builtin.set_fact:
    previous_release: "{{ (current_tag_file.content | default('') | b64decode).strip() }}"

- name: Deploy and verify the requested version
  block:
    - name: Deploy {{ image_tag }}
      ansible.builtin.include_tasks: release.yml
      vars:
        release_tag: "{{ image_tag }}"

  rescue:
    - name: Show the failing containers
      ansible.builtin.command:
        cmd: docker compose --env-file secrets.env --env-file release.env ps -a
        chdir: "{{ app_dir }}"
      changed_when: false
      failed_when: false
      register: failed_ps

    - name: Print container status
      ansible.builtin.debug:
        var: failed_ps.stdout_lines

    - name: Roll back to {{ previous_release }}
      when: auto_rollback | bool and previous_release | length > 0 and previous_release != image_tag
      ansible.builtin.include_tasks: release.yml
      vars:
        release_tag: "{{ previous_release }}"

    - name: Stop the deploy and report the result
      ansible.builtin.fail:
        msg: >-
          Version {{ image_tag }} could not be deployed (image pull, container start or health checks failed).
          {{ ('Rolled back to ' ~ previous_release ~ ', which is running again.')
             if (auto_rollback | bool and previous_release | length > 0 and previous_release != image_tag)
             else 'No earlier version to roll back to.' }}

- name: Record the previous version
  when: previous_release | length > 0 and previous_release != image_tag
  ansible.builtin.copy:
    dest: "{{ app_dir }}/PREVIOUS_TAG"
    content: "{{ previous_release }}\n"
    mode: "0644"

- name: Record the running version
  ansible.builtin.copy:
    dest: "{{ app_dir }}/CURRENT_TAG"
    content: "{{ image_tag }}\n"
    mode: "0644"

- name: Append to the release history
  ansible.builtin.lineinfile:
    path: "{{ app_dir }}/releases.log"
    line: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }} {{ image_tag }} (previous: {{ previous_release | default('none', true) }})"
    create: true
    mode: "0644"

- name: Summary
  ansible.builtin.debug:
    msg:
      - "Running version: {{ image_tag }} (previous: {{ previous_release | default('none', true) }})"
      - "Storefront: http://{{ ansible_host }}/  Admin: http://{{ ansible_host }}/admin"
      - "Admin login: {{ admin_email }}; password: run on the server: sudo grep ADMIN_PASSWORD {{ app_dir }}/secrets.env"
