# Prometheus scrapes every Node.js service's /metrics endpoint over the Compose network.
# /metrics is internal: Nginx does not expose it, so only Prometheus can read it.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ecommerce-services
    metrics_path: /metrics
    # The services already label every series with service="..."; keep their value.
    honor_labels: true
    static_configs:
      - targets: ["authentication-service:3003"]
        labels: { service: authentication-service }
      - targets: ["product-service:3001"]
        labels: { service: product-service }
      - targets: ["cart-service:3006"]
        labels: { service: cart-service }
      - targets: ["inventory-service:3004"]
        labels: { service: inventory-service }
      - targets: ["order-service:3002"]
        labels: { service: order-service }
      - targets: ["payment-service:3005"]
        labels: { service: payment-service }
      - targets: ["search-service:3007"]
        labels: { service: search-service }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
