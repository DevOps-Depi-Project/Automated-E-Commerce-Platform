# search-service: Product search with its own index.
# Generated layout shared by all Node.js services; see kubernetes/README section in the main README.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  labels:
    app.kubernetes.io/name: search-service
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # Zero-downtime rolling update: start one new pod, wait until it is ready, then stop an old one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: search-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search-service
        app.kubernetes.io/part-of: ecommerce
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3007"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      # Wait for PostgreSQL so the migration does not fail and restart the pod.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -q; do echo waiting for postgres; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
      containers:
        - name: search-service
          image: mosab2004/ecommerce-search-service:latest
          command: ["sh", "-c", "npm run migrate && exec node server.js"]
          ports:
            - name: http
              containerPort: 3007
          envFrom:
            - configMapRef:
                name: ecommerce-config
          env:
            - name: PORT
              value: "3007"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: ecommerce-secrets, key: POSTGRES_PASSWORD }
            # Kubernetes expands $(VAR) from variables defined above in this list.
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          # startupProbe gives the migration up to 3 minutes; then readiness decides whether the
          # pod receives traffic and liveness restarts it if it hangs.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  labels:
    app.kubernetes.io/name: search-service
    app.kubernetes.io/part-of: ecommerce
spec:
  selector:
    app.kubernetes.io/name: search-service
  ports:
    - name: http
      port: 3007
      targetPort: http
