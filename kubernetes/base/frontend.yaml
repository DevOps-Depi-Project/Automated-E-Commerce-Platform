# frontend: Nginx serving the storefront and acting as the reverse proxy for /api/<service>/.
# The same image as in Docker Compose; only the DNS settings of its config template change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: ecommerce
    spec:
      containers:
        - name: frontend
          image: mosab2004/ecommerce-frontend:latest
          ports:
            - name: http
              containerPort: 80
          env:
            # nginx resolves service names per request and does not use DNS search
            # domains, so it needs the cluster DNS server and fully qualified names.
            - name: NGINX_RESOLVER
              value: kube-dns.kube-system.svc.cluster.local
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: API_DOMAIN_SUFFIX
              value: .$(POD_NAMESPACE).svc.cluster.local
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { cpu: 300m, memory: 64Mi }
---
# Entry point from outside the cluster. Docker Desktop and k3s map a LoadBalancer
# service to the node itself; on a cloud cluster it creates a load balancer.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: ecommerce
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
